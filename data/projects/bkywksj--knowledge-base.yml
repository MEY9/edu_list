description_zh: 通过教育相关主题检索收集；可评估用于教学资料知识库、课程问答或学习助手；具体能力待核对。
upstream_description: 本地优先的知识库桌面应用。Markdown 编辑器 + 全文搜索（FTS5） + 双向链接 / 知识图谱；多端同步（WebDAV
  / S3 / 同步盘，单笔记粒度增量 + 自动双向调度，含整库 ZIP 备份）；AI 问答与智能规划（OpenAI 兼容 / Ollama / 自定义 provider，工具调用框架）；支持导入
  .md / .txt / .pdf / .docx（自动嗅探编码）；笔记加密 Vault + 隐藏笔记 PIN；自定义数据目录；跨平台 Win/macOS/Linux
  + 应用内自动更新。Tauri 2.x + React 19 + Rust + SQLite，零云端依赖。
