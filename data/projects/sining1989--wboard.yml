upstream_description: WBoard是一款在Windows平台基于VS2017、Qt5.9.5开发的一款开放源码的白板教学软件，主要用于学校和大学的交互式电子白板。
  它既可以与交互式白板一起使用，也可以在双屏幕场景中通过笔、平板显示器和光束进行使用。 主要有演示板、网页、文档和桌面四大界面。由于时间有限，代码中不妥之处恳请广大读者批评指正。
