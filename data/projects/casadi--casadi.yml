upstream_description: CasADi is a symbolic framework for numeric optimization implementing
  automatic differentiation in forward and reverse modes on sparse matrix-valued computational
  graphs. It supports self-contained C-code generation and interfaces state-of-the-art
  codes such as SUNDIALS, IPOPT etc. It can be used from C++, Python, Matlab/Octave,
  Julia or Javascript
