name: Update GitHub metrics

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/projects/**'
      - 'data/categories.yml'
      - 'scripts/**'
      - 'templates/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-github-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fetch_metrics.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/validate.py
      - run: python scripts/build_lists.py
      - run: python scripts/build_lists.py --check
      - name: Commit updated data and lists
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metrics.json data/catalog.json data/snapshots README.md lists
          if git diff --cached --quiet; then
            echo 'No catalog changes.'
            exit 0
          fi
          git commit -m 'chore: refresh GitHub metrics and education lists'
          git push origin HEAD:main
